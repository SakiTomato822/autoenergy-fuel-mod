name: Build Fuel APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default includes the removed legacy "tools" package.
          packages: platform-tools

      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore existing APK signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || { echo "Signing Secret is missing" >&2; exit 1; }
          key_path="$RUNNER_TEMP/autoenergy-debug.keystore"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "AUTOENERGY_DEBUG_KEYSTORE=$key_path" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$key_path" -storepass android -alias androiddebugkey \
            | tr -d ':' \
            | grep -qi 'SHA256: 91F7B9D6496414A0FAB0A87C8FCC60F929DF0DD9FA4D4A9A52215869178BAB8D'

      - name: Build and test debug APK
        run: gradle --no-daemon --no-build-cache --rerun-tasks :app:assembleDebug :app:testDebugUnitTest

      - name: Verify upgrade signature and APK metadata
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee apk-certificate.txt
          grep -q 'SHA-256 digest: 91f7b9d6496414a0fab0a87c8fcc60f929df0dd9fa4d4a9a52215869178bab8d' apk-certificate.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-metadata.txt
          grep -q "name='com.lynk.autoenergyfuel.dhureadonly'.*versionCode='24'.*versionName='1.0.0'" apk-metadata.txt
          if grep -Eq 'ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|FOREGROUND_SERVICE_LOCATION' apk-metadata.txt; then
            echo 'Pure fuel APK must not request GPS permissions' >&2
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoenergy-fuel-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoenergy-fuel-ui-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
